# sources.yaml — DANH MỤC NGUỒN TẢI KHO NEO TIN CẬY.
#
# ⚠️ CHỈ chấp nhận URL HTTPS thuộc miền chính thức rootca.gov.vn. Công cụ
#    tools/sync_trust_store.py sẽ TỪ CHỐI mọi URL khác miền hoặc không phải https.
#
# Điền URL THẬT từ https://rootca.gov.vn (không đoán). Thêm CA mới = thêm một mục
# vào danh sách `items` — KHÔNG cần sửa code (kiến trúc chịu được thay đổi).
#
# role: root | crl | ca | tsa | foreign
#   root    — chứng thư gốc Vietnam National Root CA (neo tin cậy DUY NHẤT)
#   crl     — CRL của Root
#   ca      — chứng thư một CA công cộng
#   foreign — CA/CTCKS nước ngoài được công nhận (TT 06/2024/TT-BTTTT)

source_host: "rootca.gov.vn"

items:
  - role: root
    name: "neac_root_ca"
    url: ""            # ĐIỀN: URL chứng thư gốc từ mục "CTCKS ROOTCA"

  - role: crl
    name: "neac_root_crl"
    url: ""            # ĐIỀN: URL CRL từ mục "DANH SÁCH CTCKS THU HỒI"

